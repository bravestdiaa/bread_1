<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قرار الزيارة</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff"/>
    <link rel="apple-touch-icon" href="icons/icon-192x192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .highlight-day-name { background-color: #dbeafe; color: #1e3a8a; font-weight: bold; }
        .highlight-date { box-shadow: inset 0 0 0 2px #3b82f6; } /* إطار داخلي لليوم الحالي */
        .selected-date { box-shadow: inset 0 0 0 2px #1e3a8a; } /* إطار داخلي لليوم المختار */
        
        /* إخفاء الأزرار بشكل افتراضي */
        #installBtn, #closeAppBtn { display: none; }
    </style>
</head>
<body class="bg-gray-100 pb-24">

    <div class="container mx-auto px-2 sm:px-4 max-w-4xl text-center">
        
        <header class="my-4">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800">قرار الزيارة اليومي</h1>
        </header>

        <!-- صندوق عرض حالة اليوم الحالي -->
        <div id="resultBox" class="p-4 rounded-xl shadow-lg text-white font-bold text-xl mb-3">
            <p id="resultMessage"></p>
        </div>
        
        <!-- صندوق عرض حالة اليوم المختار (مخفي افتراضياً) -->
        <div id="selectedDayResultBox" class="p-4 rounded-xl shadow-lg text-white font-bold text-xl mb-4" style="display: none;">
            <p id="selectedDayMessage"></p>
        </div>

        <!-- التقويم المدمج -->
        <div class="mt-4 bg-white p-2 sm:p-4 rounded-xl shadow-md">
            <h2 id="calendarTitle" class="text-xl font-bold text-gray-800 mb-2"></h2>
            <div class="overflow-x-auto">
                <table class="w-full border-collapse">
                    <thead id="calendarHead"></thead>
                    <tbody id="calendarBody"></tbody>
                </table>
            </div>
        </div>
        
        <div class="mt-6 space-y-3">
            <button id="installBtn" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md">
                تثبيت التطبيق
            </button>
            <button id="closeAppBtn" class="w-full sm:w-auto bg-gray-700 hover:bg-gray-900 text-white font-bold py-2 px-6 rounded-lg shadow-md">
                إغلاق التطبيق
            </button>
        </div>

    </div>

    <script>
        // --- الإعدادات والتهيئه ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }
        
        const today = new Date();
        let currentSelectedCell = null;
        let deferredPrompt;

        // --- دوال مساعدة ---
        function getDayStatus(day) {
            const category = day % 3;
            if (category === 1) return { key: 'bad', color: 'bg-red-500', text: 'لا يُنصح بالذهاب فيه.' };
            if (category === 2) return { key: 'ok', color: 'bg-yellow-500', text: 'يمكن الذهاب فيه، لكن الأفضل الانتظار.' };
            if (category === 0) return { key: 'good', color: 'bg-green-500', text: 'هو الأفضل للذهاب.' };
            return { key: 'none', color: '', text: '' };
        }

        function showDayInfo(dayNumber, cellElement) {
            const selectedBox = document.getElementById('selectedDayResultBox');
            const selectedMessage = document.getElementById('selectedDayMessage');
            
            const status = getDayStatus(dayNumber);
            
            // تحديث رسالة ولون الصندوق
            selectedMessage.textContent = `موقف يوم ${dayNumber}: ${status.text}`;
            selectedBox.className = `p-4 rounded-xl shadow-lg text-white font-bold text-xl mb-4 ${status.color}`;
            selectedBox.style.display = 'block';

            // تحديث التمييز البصري في الجدول
            if (currentSelectedCell) {
                currentSelectedCell.classList.remove('selected-date');
            }
            cellElement.classList.add('selected-date');
            currentSelectedCell = cellElement;
        }

        // --- دوال بناء الواجهة ---
        function generateCalendar(year, month) {
            const calendarHead = document.getElementById('calendarHead');
            const calendarBody = document.getElementById('calendarBody');
            const calendarTitle = document.getElementById('calendarTitle');
            const monthNames = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
            const dayNames = ['ح', 'ن', 'ث', 'ر', 'خ', 'ج', 'س']; // أسماء أيام مختصرة
            calendarTitle.textContent = `تقويم شهر ${monthNames[month]} ${year}`;

            const firstDayOfMonth = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const numWeeks = Math.ceil((firstDayOfMonth + daysInMonth) / 7);

            let headHTML = '<tr><th class="p-1 text-xs border-b"></th>';
            for (let i = 0; i < numWeeks; i++) {
                headHTML += `<th class="p-1 text-xs font-medium text-gray-500 border-b">أ${i + 1}</th>`;
            }
            headHTML += '</tr>';
            calendarHead.innerHTML = headHTML;
            
            let bodyHTML = '';
            for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
                let rowHTML = '<tr>';
                const isTodayRow = (dayIndex === today.getDay() && month === today.getMonth() && year === today.getFullYear());
                const dayNameClass = isTodayRow ? 'highlight-day-name' : 'bg-gray-50';
                rowHTML += `<th class="p-1 text-xs border-t font-bold text-gray-700 ${dayNameClass}">${dayNames[dayIndex]}</th>`;

                for (let weekIndex = 0; weekIndex < numWeeks; weekIndex++) {
                    const dayNumber = (weekIndex * 7) + dayIndex - firstDayOfMonth + 1;
                    if (dayNumber > 0 && dayNumber <= daysInMonth) {
                        const isTodayCell = (dayNumber === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                        const status = getDayStatus(dayNumber);
                        const highlightClass = isTodayCell ? 'highlight-date' : '';
                        // تغيير حجم الخلية والخط
                        rowHTML += `<td class="border-t p-0 h-10 text-xs text-center align-middle cursor-pointer ${status.key}" onclick="showDayInfo(${dayNumber}, this)">
                                        <div class="w-full h-full flex items-center justify-center ${highlightClass}">${dayNumber}</div>
                                    </td>`;
                    } else {
                        rowHTML += '<td class="border-t h-10 bg-gray-50"></td>';
                    }
                }
                rowHTML += '</tr>';
                bodyHTML += rowHTML;
            }
            calendarBody.innerHTML = bodyHTML;
        }

        // --- التنفيذ عند تحميل الصفحة ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installBtn');
            installBtn.style.display = 'block';
            installBtn.addEventListener('click', () => {
                installBtn.style.display = 'none';
                deferredPrompt.prompt();
            });
        });

        window.onload = function() {
            // إظهار زر الإغلاق إذا كان التطبيق مثبتاً
            if (window.matchMedia('(display-mode: standalone)').matches) {
                document.getElementById('installBtn').style.display = 'none';
                document.getElementById('closeAppBtn').style.display = 'block';
            }

            // عرض حالة اليوم الحالي
            const resultBox = document.getElementById('resultBox');
            const resultMessage = document.getElementById('resultMessage');
            const dayOfMonth = today.getDate();
            const status = getDayStatus(dayOfMonth);
            resultMessage.textContent = `اليوم: ${status.text}`;
            resultBox.className += ' ' + status.color;
            
            // إنشاء التقويم
            generateCalendar(today.getFullYear(), today.getMonth());
        };
    </script>
</body>
</html>
